syntax = "proto3";
package app.arena;
import "entity/arena.proto";

message GetRankingListRequest {
  int64 season_id = 1;
  int64 league_id = 2;
  repeated int32 ranks = 3;
}

message GetRankingListResponse {
  repeated .entity.ArenaRankingEntry ranking = 1;
}

service ArenaService {
  rpc GetRankingList (.app.arena.GetRankingListRequest) returns (.app.arena.GetRankingListResponse);
}
