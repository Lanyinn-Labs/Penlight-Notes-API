name: Android version monitor

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-version-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Detect official Android version
        id: version
        run: |
          python scripts/check_android_version.py \
            --write-candidate docs/android-update-candidate.md \
            --prepare-update \
            --github-output "$GITHUB_OUTPUT"
        shell: bash
      - name: Prepare review branch
        if: steps.version.outputs.update_available == 'true'
        id: candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config commit.gpgsign false
          candidate_dir=$(mktemp -d)
          cp docs/android-update-candidate.md "$candidate_dir/candidate.md"
          cp data/jp-client.json "$candidate_dir/version"
          git restore -- data/jp-client.json
          if git ls-files --error-unmatch docs/android-update-candidate.md >/dev/null 2>&1; then
            git restore -- docs/android-update-candidate.md
          else
            rm -f docs/android-update-candidate.md
          fi
          base_branch='${{ github.event.repository.default_branch }}'
          branch=automation/android-client-update
          # Build the proposal from the latest default branch on every run.
          previous=$(git ls-remote --heads origin "$branch" | cut -f1)
          git switch -C "$branch" "origin/$base_branch"
          mkdir -p docs
          cp "$candidate_dir/candidate.md" docs/android-update-candidate.md
          cp "$candidate_dir/version" data/jp-client.json
          git add -- docs/android-update-candidate.md data/jp-client.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore: prepare Japanese Android client version update'
          # Identical trees need no new commit, but a missing PR can still be restored.
          if [ -n "$previous" ]; then
            git fetch origin "$branch"
            if git diff --quiet FETCH_HEAD HEAD; then
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          git push --force-with-lease="refs/heads/$branch:$previous" origin "HEAD:$branch"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Open or refresh draft adaptation PR
        id: pr
        if: steps.version.outputs.update_available == 'true'
        shell: bash
        run: |
          base_branch='${{ github.event.repository.default_branch }}'
          if [ "$(gh pr list --head automation/android-client-update --base "$base_branch" --state open --json number --jq 'length')" = 0 ]; then
            gh pr create --draft --base "$base_branch" --head automation/android-client-update \
              --title 'chore: review Japanese Android client version update' \
              --body-file docs/android-update-candidate.md
            echo 'created=true' >> "$GITHUB_OUTPUT"
          else
            gh pr edit automation/android-client-update --body-file docs/android-update-candidate.md
          fi
      - name: Run checks on candidate branch
        if: steps.candidate.outputs.changed == 'true' || steps.pr.outputs.created == 'true'
        run: gh workflow run ci.yml --ref automation/android-client-update
      - name: Close completed adaptation PR
        if: steps.version.outputs.status == 'current'
        shell: bash
        run: |
          base_branch='${{ github.event.repository.default_branch }}'
          number=$(gh pr list --head automation/android-client-update --base "$base_branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr close "$number" --delete-branch
          fi
